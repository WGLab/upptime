# Change these first
owner: WGLab # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: ANNOVAR
    url: https://annovar.openbioinformatics.org/
  - name: PennCNV
    url: https://penncnv.openbioinformatics.org/
  - name: GenGen
    url: https://gengen.openbioinformatics.org/
  - name: PubMind
    url: https://pubmind.wglab.org
  - name: PhenoSV
    url: https://phenosv.wglab.org
  - name: Doc2HPO
    url: https://doc2hpo.wglab.org
  - name: Phen2Gene
    url: https://phen2gene.wglab.org
  - name: PDIDB
    url: https://pdidb.wglab.org
  - name: wANNOVAR
    url: https://wannovar.wglab.org
  - name: Phenolyzer
    url: https://phenolyzer.wglab.org
  - name: wInterVar
    url: https://wintervar.wglab.org
  - name: CancerVar
    url: https://cancervar.wglab.org
  - name: Secret Site
    url: $SECRET_SITE

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: upptime.wglab.org
  # baseUrl: /your-repo-name
  #logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  logoUrl: https://wglab.org/assets/images/ico/favicon.png
  name: WGLab Upptime
  introTitle: "**WGLab Upptime**"
  introMessage: WGLab Upptime monitors various WGLab web servers to ensure that they are online.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/WGLab/
    - title: WGLab
      href: https://wglab.org/

# Upptime also supports notifications, assigning issues, and more
